<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Диагностика кофемашин</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#3C2F2F;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.app{
  max-width:520px;
  margin:auto;
  padding:22px 16px 35px;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:700;
  margin:8px 0 6px;
}

.subtitle{
  text-align:center;
  color:#cfc7c5;
  font-size:15px;
  margin-bottom:25px;
}

.step{
  display:none;
}

.step.active{
  display:block;
}

h2{
  font-size:24px;
  line-height:1.2;
  margin:10px 0 18px;
}

p{
  color:#d8d0ce;
  line-height:1.45;
}

.option{
  width:100%;
  padding:17px 16px;
  margin:9px 0;
  border:2px solid #665554;
  border-radius:13px;
  background:#493938;
  color:#fff;
  font-size:17px;
  text-align:left;
  cursor:pointer;
  transition:.15s;
}

.option.selected{
  background:#FF5722;
  border-color:#FF5722;
}

.option:active{
  transform:scale(.98);
}

input,textarea{
  width:100%;
  background:#493938;
  color:#fff;
  border:2px solid #665554;
  border-radius:13px;
  padding:16px;
  font-size:17px;
  outline:none;
  margin-bottom:12px;
}

input:focus,textarea:focus{
  border-color:#FF5722;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.btn{
  width:100%;
  padding:17px;
  border:0;
  border-radius:13px;
  background:#666;
  color:#aaa;
  font-size:18px;
  font-weight:700;
  margin-top:12px;
}

.btn.ready{
  background:#FF5722;
  color:#fff;
  cursor:pointer;
}

.back{
  background:transparent;
  color:#aaa;
  border:0;
  font-size:16px;
  padding:12px 0;
}

.progress{
  height:5px;
  background:#554544;
  border-radius:10px;
  margin:0 0 25px;
  overflow:hidden;
}

.progress div{
  height:100%;
  width:14%;
  background:#FF5722;
  transition:.2s;
}

.review{
  background:#493938;
  border-radius:15px;
  padding:18px;
  line-height:1.55;
  white-space:pre-line;
}

.success{
  text-align:center;
  padding-top:35px;
}

.success-icon{
  font-size:64px;
  margin-bottom:15px;
}

.small{
  font-size:13px;
  color:#aaa;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="logo">🔧 Диагностика кофемашины</div>

<button class="btn" id="next2" onclick="goStep3()">Далее</button>
</div>

<!-- 3 -->

<input id="model" placeholder="Например: Jura E8">

<button class="btn" onclick="goStep4()">Далее</button>
</div>
