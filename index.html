<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TEST</title>
</head>

<body style="background:#3C2F2F;color:white;font-family:Arial;padding:30px">

<h2>ТЕСТ JAVASCRIPT</h2>

<button
  onclick="test()"
  style="padding:20px;width:100%;font-size:20px">
  НАЖМИ МЕНЯ
</button>

<p id="result" style="font-size:20px;margin-top:30px">
  Пока ничего не произошло
</p>

<script>
function test() {
  document.getElementById("result").innerText =
    "✅ JAVASCRIPT РАБОТАЕТ";
}
</script>

</body>
</html>
